services:
  processor:
    build:
      context: .
      dockerfile: Modules/processor/Dockerfile
    image: viral-mpv/processor:dev
    container_name: viral-mpv-processor
    restart: unless-stopped
    env_file:
      - .env.processor
    environment:
      MEDIA_DIR: /media
      DB_DIR: /db
    volumes:
      - ./data/media:/media
      # SQLite WAL несовместим с Windows bind-mount — используем именованный volume
      - processor_db:/db
    ports:
      - "8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  script:
    build:
      context: .
      dockerfile: Modules/script/Dockerfile
    image: viral-mpv/script:dev
    container_name: viral-mpv-script
    restart: unless-stopped
    env_file:
      - .env.script
    environment:
      DB_DIR: /db
    volumes:
      # SQLite WAL несовместим с Windows bind-mount — используем именованный volume
      - script_db:/db
    ports:
      - "8200:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/script/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  profile:
    build:
      context: .
      dockerfile: Modules/profile/Dockerfile
    image: viral-mpv/profile:dev
    container_name: viral-mpv-profile
    restart: unless-stopped
    env_file:
      - .env.profile
    environment:
      DB_DIR: /db
    volumes:
      - profile_db:/db
    ports:
      - "8300:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/profile/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  monitor:
    build:
      context: .
      dockerfile: Modules/monitor/Dockerfile
    image: viral-mpv/monitor:dev
    container_name: viral-mpv-monitor
    restart: unless-stopped
    env_file:
      - .env.monitor
    environment:
      DB_DIR: /db
    volumes:
      - monitor_db:/db
    ports:
      - "8400:8000"
    depends_on:
      profile:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/monitor/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  downloader:
    build:
      context: .
      dockerfile: Modules/downloader/Dockerfile
    image: viral-mpv/downloader:dev
    container_name: viral-mpv-downloader
    restart: unless-stopped
    env_file:
      - .env.downloader
    environment:
      MEDIA_DIR: /media
      DB_DIR: /db
    volumes:
      - ./data/media:/media
      - downloader_db:/db
    ports:
      - "8500:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  knowledge:
    build:
      context: .
      dockerfile: Modules/knowledge/Dockerfile
    image: viral-mpv/knowledge:dev
    container_name: viral-mpv-knowledge
    restart: unless-stopped
    env_file:
      - .env.knowledge
    environment:
      DB_DIR: /db
    volumes:
      - knowledge_db:/db
    ports:
      - "8600:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  carousel:
    build:
      context: .
      dockerfile: Modules/carousel/Dockerfile
    image: viral-mpv/carousel:dev
    container_name: viral-mpv-carousel
    restart: unless-stopped
    env_file:
      - .env.carousel
    environment:
      DB_DIR: /db
      MEDIA_DIR: /media
    volumes:
      - ./data/media:/media
      - carousel_db:/db
    ports:
      - "8700:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/carousel/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  publisher:
    build:
      context: .
      dockerfile: Modules/publisher/Dockerfile
    image: viral-mpv/publisher:dev
    container_name: viral-mpv-publisher
    restart: unless-stopped
    env_file:
      - .env.publisher
    environment:
      DB_DIR: /db
      MEDIA_DIR: /media
    volumes:
      - ./data/media:/media
      - publisher_db:/db
    ports:
      - "8800:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/publisher/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  analytics:
    build:
      context: .
      dockerfile: Modules/analytics/Dockerfile
    image: viral-mpv/analytics:dev
    container_name: viral-mpv-analytics
    restart: unless-stopped
    env_file:
      - .env.analytics
    environment:
      DB_DIR: /db
    volumes:
      - analytics_db:/db
    ports:
      - "8900:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/analytics/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  shell:
    build:
      context: .
      dockerfile: Modules/shell/Dockerfile
    image: viral-mpv/shell:dev
    container_name: viral-mpv-shell
    restart: unless-stopped
    env_file:
      - .env.profile
      - .env.monitor
      - .env.shell
      # Подключаем env остальных модулей чтобы /api/services/status видел
      # OPENAI/ANTHROPIC/ASSEMBLYAI/DEEPGRAM/GROQ/GEMINI ключи. Сами модули
      # читают свои env-файлы независимо — shell использует только как
      # источник для service-status dashboard.
      - .env.processor
      - .env.knowledge
      - .env.downloader
      - .env.carousel
      # .env.analytics ДО .env.publisher: оба содержат PUBLISHER_TOKEN, но
      # авторитетен он только в .env.publisher — он должен грузиться последним,
      # иначе пустой PUBLISHER_TOKEN из .env.analytics затрёт настоящий.
      - .env.analytics
      - .env.publisher
    environment:
      PROFILE_URL: http://profile:8000
      MONITOR_URL: http://monitor:8000
      SCRIPT_URL: http://script:8000
      CAROUSEL_URL: http://carousel:8000
      PUBLISHER_URL: http://publisher:8000
      ANALYTICS_URL: http://analytics:8000
      MEDIA_DIR: /media
    volumes:
      - shell_db:/db
      # Read-only access to processor's media for serving frame thumbnails / audio
      - ./data/media:/media:ro
    ports:
      - "8000:8000"
    depends_on:
      - processor
      - profile
      - script
      - monitor
      - downloader
      - carousel
      - publisher
      - analytics
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  processor_db:
  script_db:
  profile_db:
  monitor_db:
  downloader_db:
  shell_db:
  knowledge_db:
  carousel_db:
  publisher_db:
  analytics_db:
